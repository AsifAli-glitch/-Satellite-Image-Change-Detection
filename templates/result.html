<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Change Detection Results</title>
    <style>
        :root {
            --primary: #5D7B6F;
            --primary-hover: #465E54;
            --bg: #EAE7D6;
            --card-bg: #F4F2E7;
            --text: #202D27;
            --text-muted: #5D7B6F;
            --border: #D3CEB8;
        }
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background: var(--bg);
            color: var(--text);
            min-height: 100vh;
            padding: 30px 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }
        .container {
            max-width: 1100px;
            width: 100%;
            background: var(--card-bg);
            padding: 30px;
            border-radius: 14px;
            box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.05);
            border: 1px solid var(--border);
            text-align: center;
        }
        h1 {
            font-size: 24px;
            font-weight: 700;
            margin-bottom: 8px;
        }
        p.subtitle {
            color: var(--text-muted);
            font-size: 14px;
            margin-bottom: 24px;
        }
        .image-wrapper {
            margin: 20px 0;
            padding: 10px;
            background: #202D27;
            border-radius: 10px;
            display: inline-block;
            max-width: 100%;
        }
        .image-wrapper img {
            max-width: 100%;
            height: auto;
            border-radius: 6px;
            display: block;
        }
        .action-bar {
            margin-top: 25px;
            display: flex;
            justify-content: center;
            gap: 15px;
        }
        .btn {
            display: inline-block;
            padding: 12px 22px;
            border-radius: 8px;
            font-size: 14px;
            font-weight: 600;
            text-decoration: none;
            transition: all 0.2s ease;
        }
        .btn-primary {
            background: var(--primary);
            color: #EAE7D6;
        }
        .btn-primary:hover {
            background: var(--primary-hover);
        }
        .btn-outline {
            background: transparent;
            color: var(--text);
            border: 1px solid var(--border);
        }
        .btn-outline:hover {
            background: #EDEAD9;
        }
    </style>
</head>
<body>

<div class="container">
    <h1>Change Detection Result</h1>
    <p class="subtitle">Visual representation of Before, After, Difference Intensity, and the Extracted Binary Change Mask.</p>

    <div class="image-wrapper">
        <a href="{{ result_image }}" target="_blank" title="Click to view full size">
            <img src="{{ result_image }}" alt="Change Detection Pipeline Result">
        </a>
    </div>

    <div class="action-bar">
        <a href="/" class="btn btn-outline">← Run Another Analysis</a>
        <a href="{{ result_image }}" download class="btn btn-primary">⬇ Download Result Image</a>
    </div>
</div>

</body>
</html>
